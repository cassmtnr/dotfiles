name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh update.sh lib/*.sh .defaults capture-setting.sh

      # Linux OpenSSH terminates on an unknown keyword rather than warning, so
      # a macOS-only option reaching a server breaks every ssh call on it.
      - name: ssh config parses on Linux
        run: |
          chmod 600 .ssh/config
          ssh -F .ssh/config -G github.com > /dev/null

  install:
    # The real "new machine" test: without a terminal install.sh runs
    # non-interactively (no extras), twice — the second run proves
    # idempotence. Runners have Homebrew preinstalled. timeout-minutes:
    # a regression that reintroduces a prompt must fail, not hang for the
    # 6-hour default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ui.sh non-interactive contract (no TTY = no prompts, defaults win)
        run: |
          bash -c 'set -euo pipefail
            source lib/common.sh; source lib/ui.sh
            fail() { echo "CONTRACT FAILED: $1" >&2; exit 1; }
            # errexit is suppressed inside && / || lists, so these need an
            # explicit exit — a bare `ui_confirm ... && echo` can never fail
            ui_confirm "default yes?" y || fail "default y must return yes"
            ! ui_confirm "default no?" n || fail "default n must return no"
            test "$(ui_choose "pick" "first:Label A" "second:Label B")" = "first" \
              || fail "ui_choose must pick the first value"
            test -z "$(ui_choose_many "pick many" "a:One" "b:Two")" \
              || fail "ui_choose_many must select nothing"
            run_step "always ok" true
            run_step "always bad" false
            ! ui_summary || fail "summary must report a failed step"
            # a step that skips itself is reported, not shown as ✓
            skips() { ui_skip "no reason"; return 0; }
            run_step "always skipped" skips
            case "${_UI_STEP_STATUS[*]}" in *skipped*) ;; *) fail "skip not recorded" ;; esac
            # --verbose must not run steps in a subshell
            VERBOSE=true; MARK=lost
            mutate() { MARK=kept; return 0; }
            run_step "verbose keeps env" mutate
            test "$MARK" = kept || fail "--verbose ran the step in a subshell"' < /dev/null
      - name: extras contract (admin auth happens outside run_step)
        run: |
          bash -c 'set -uo pipefail
            source lib/common.sh; source lib/ui.sh
            IS_MACOS=false; IS_LINUX=true; RUN_SUDO=true
            source lib/extras.sh
            fail() { echo "CONTRACT FAILED: $1" >&2; exit 1; }
            ORDER=$(mktemp)
            # A password prompt under run_step is repainted by the spinner and
            # reads as a hang, so auth must be ordered before the step starts.
            sudo() { echo "auth" >> "$ORDER"; return 0; }
            run_step() { echo "run_step" >> "$ORDER"; }
            ui_choose_many() { echo "motd"; }
            install_extras > /dev/null 2>&1
            head -1 "$ORDER" | grep -qx auth || fail "auth did not precede run_step"
            # An extra that authenticates must say so in its menu label, and
            # one that says so must authenticate: the label is the only warning.
            IS_MACOS=true
            while IFS= read -r line; do
              name=${line%%:*}; label=${line#*:}
              case "$label" in
                *sudo*) extra_needs_sudo "$name" || fail "$name: label says sudo, not declared" ;;
                *)      extra_needs_sudo "$name" && fail "$name: declared, but label never says so" ;;
              esac
            done < <(extras_available)
            # Refusing admin skips the step instead of running it half-privileged
            : > "$ORDER"; IS_MACOS=false
            sudo() { return 1; }
            install_extras > /dev/null 2>&1
            grep -q run_step "$ORDER" && fail "step ran despite refused auth"
            rm -f "$ORDER"' < /dev/null

      - name: install (safe defaults)
        run: ./install.sh

      # npm -g binaries land in nvm's default-version bin, and sourcing nvm.sh
      # leaves `nvm current` at "system" — without the PATH entry in .zshenv
      # every global install is unreachable and looks like it failed.
      - name: zshenv exposes nvm's default-version bin
        run: |
          zsh -c 'set -e
            NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [[ -r "$NVM_DIR/alias/default" ]] || { echo "no nvm default alias; nothing to assert"; exit 0; }
            v=$(<"$NVM_DIR/alias/default")
            [[ -d "$NVM_DIR/versions/node/v${v#v}/bin" ]] || { echo "default v$v not installed"; exit 0; }
            source ./.zshenv
            case "$PATH" in
              *"$NVM_DIR/versions/node/v${v#v}/bin"*) echo "nvm default bin is on PATH" ;;
              *) echo "FAILED: nvm default bin missing from PATH" >&2; exit 1 ;;
            esac'
      - name: install again (idempotence)
        run: ./install.sh

  # The one path the matrix above can never reach: both hosted runners ship
  # Homebrew preinstalled, so install_homebrew always reports "already
  # installed" and its Linux bootstrap has never executed. A bare container has
  # no Homebrew, so the bootstrap runs for real — the sudo it needs, the
  # download, and the PATH it leaves for .zshenv and ensure_brew_path.
  install-without-homebrew:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      # Deliberately minimal: only what the container needs to check out and
      # start the script. install_deps is responsible for the rest, and
      # pre-installing its packages here would mask a regression in it.
      - name: bootstrap the image
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git curl ca-certificates

      # Homebrew refuses to install as root and the container runs as root, so
      # the script needs a normal user. NOPASSWD stands in for the prompt a
      # non-interactive run can never answer.
      - name: unprivileged user
        run: |
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: hand the checkout to that user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      # Guard the premise: if the image ever ships brew, this job silently goes
      # back to testing nothing, which is the exact failure it exists to end.
      - name: assert no Homebrew present
        run: |
          if command -v brew > /dev/null; then
            echo "image already has Homebrew — this job would prove nothing" >&2
            exit 1
          fi

      # </dev/null: no TTY, so ui_confirm takes the platform default, which is
      # RUN_SUDO=true on Linux — the privileged bootstrap branch.
      - name: install (bootstraps Homebrew for real)
        run: sudo -u builder -H bash -c 'cd "'"$GITHUB_WORKSPACE"'" && ./install.sh' < /dev/null

      - name: brew works and ensure_brew_path finds it
        run: |
          sudo -u builder -H bash -c '
            set -euo pipefail
            cd "'"$GITHUB_WORKSPACE"'"
            source lib/common.sh
            ensure_brew_path || { echo "ensure_brew_path could not locate brew" >&2; exit 1; }
            brew --version'
